# EASTER gateway — LAN only, private-CA TLS.
#
# Replace LAN_HOSTNAME below (both server blocks) with the Mac's LAN
# hostname, e.g. the .local name from System Settings → General → About.
# The mkcert certificate must be issued for the same name (see README).
server {
    listen 443 ssl;
    server_name LAN_HOSTNAME;

    ssl_certificate     /etc/nginx/certs/easter.crt;
    ssl_certificate_key /etc/nginx/certs/easter.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass https://easter-gateway:8443;

        # The gateway requires TLS even upstream; it presents a
        # self-signed cert on a trusted Docker-internal link, so
        # verification is off for this hop. Real TLS lives here,
        # at the LAN edge.
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        # The gateway's bearer tokens ride this header — forward it
        # verbatim. If this is ever stripped, every call 401s.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# Plain HTTP on the LAN: redirect to HTTPS. No plaintext API.
server {
    listen 80;
    server_name LAN_HOSTNAME;
    return 301 https://$host$request_uri;
}
